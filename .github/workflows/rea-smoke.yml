name: REA smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rea:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Install dependencies
        run: npm install

      - name: Verify server syntax
        run: node --check server.mjs

      - name: Verify REA CLI
        run: npm run rea -- --help
